name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The apps import the built contract package, so build before checking.
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      # Integration + e2e on PostgreSQL via Testcontainers (Docker is preinstalled on the runner).
      - run: pnpm test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f applications/b2b-backend/Dockerfile .
      - run: docker build -f applications/b2b-web/Dockerfile --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:3000 .
